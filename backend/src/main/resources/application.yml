spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:worktogether}
    username: ${DB_USER:wt}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
  jpa:
    # Niente sessione JPA aperta per tutta la richiesta HTTP: il mapping entità→DTO avviene
    # dentro i metodi @Transactional dei service (le connessioni tornano subito al pool).
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # Le associazioni lazy (tag/assegnatari degli elementi, utenti dei membri, autori...)
        # vengono inizializzate a lotti (WHERE id = ANY(?)) invece che una query per riga.
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  mail:
    # Default su Gmail; username/password vanno forniti via env (app password Google).
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  oidc:
    # Login tramite Authentik (OIDC, Authorization Code + PKCE lato frontend). Il backend valida
    # gli access token: firma RS256 (JWKS), iss = issuer, aud contiene audience (client id), exp.
    issuer: ${OIDC_ISSUER:}
    audience: ${OIDC_AUDIENCE:worktogether}
    # Vuoto ⇒ <issuer>jwks/. In produzione l'URL interno (http://authentik-server:9000/...).
    jwks-url: ${OIDC_JWKS_URL:}
    # Collegamento per email al primo accesso e promozione ad admin solo con email_verified=true.
    require-email-verified: ${OIDC_REQUIRE_EMAIL_VERIFIED:true}
    # Le connessioni WebSocket vengono chiuse quando il token usato alla CONNECT è scaduto da
    # più di questi secondi (il client si riconnette col token rinnovato).
    ws-expiry-grace-seconds: ${OIDC_WS_GRACE_SECONDS:60}
  authentik:
    # API di amministrazione per creare gli account dal pannello Amministrazione.
    api-url: ${AUTHENTIK_API_URL:}
    api-token: ${AUTHENTIK_API_TOKEN:}
    user-group: ${AUTHENTIK_USER_GROUP:worktogether}
  admin:
    # L'utente che accede con questa email (verificata da Authentik) diventa admin di sistema.
    init-email: ${ADMIN_INIT_EMAIL:}
  upload:
    dir: ${UPLOAD_DIR:/app/uploads}
  drive:
    # Tempo massimo per scaricare una cartella come ZIP (streaming asincrono: senza questo valeva il
    # timeout di Tomcat di 30 s e lo ZIP arrivava troncato). Solo per quella rotta.
    zip-timeout: ${DRIVE_ZIP_TIMEOUT:6h}
  ai:
    # Segreto per cifrare le chiavi dei provider AI a riposo. Obbligatorio in produzione.
    # JWT_SECRET resta solo come fallback legacy: le installazioni senza AI_SECRET cifravano con
    # quello, quindi va mantenuto (o copiato in AI_SECRET) per poter decifrare le chiavi salvate.
    secret: ${AI_SECRET:${JWT_SECRET:please-change-this-secret-key-in-production}}
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
  livekit:
    # Media server SFU per voce/screen share (Fase 2). Credenziali d'infra: se vuote la voce è disattivata.
    # url = URL pubblico WSS che il browser usa per connettersi (es. wss://livekit.example.com).
    url: ${LIVEKIT_URL:}
    api-key: ${LIVEKIT_API_KEY:}
    api-secret: ${LIVEKIT_API_SECRET:}
    # Durata del token d'accesso emesso da Spring (secondi).
    token-ttl-seconds: ${LIVEKIT_TOKEN_TTL:3600}
  mail:
    # Mittente delle email inviate dall'app (default: account SMTP configurato).
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  frontend:
    # URL pubblico del frontend, usato per costruire i link (es. accettazione inviti).
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}

server:
  port: 8080

logging:
  level:
    com.worktogether: INFO
    org.springframework.security: WARN
