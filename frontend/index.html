<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>WorkTogether</title>
  <meta name="description" content="Collaborazione e task management per piccoli team: Kanban, roadmap, calendario, drive, chat e agente AI." />
  <!-- PWA: installabile come app (icona desktop/home, finestra standalone) -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#8ab6f0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="WorkTogether" />
  <!-- Applica tema e accento prima del primo paint (evita il flash chiaro→scuro).
       La logica di migrazione dei vecchi temi è la stessa di ThemeProvider. -->
  <script>
    (function () {
      try {
        var d = document.documentElement
        var t = localStorage.getItem('wt-theme') || 'system'
        var a = localStorage.getItem('wt-accent') || 'indigo'
        var dark = ['dark', 'grigio', 'notte', 'carbone', 'foresta'].indexOf(t) !== -1 ||
          ((t === 'system' || ['light', 'bianco', 'crema', 'beige', 'blu', 'lavanda'].indexOf(t) === -1) &&
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        d.classList.toggle('dark', dark)
        d.setAttribute('data-theme', dark ? 'dark' : 'light')
        d.setAttribute('data-accent', a)
      } catch (e) {}
    })()
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
