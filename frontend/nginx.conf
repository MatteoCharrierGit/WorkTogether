# Connection header condizionale: "upgrade" solo per le vere richieste di upgrade WebSocket,
# altrimenti "close". SockJS usa più trasporti sotto /ws/ (info/xhr/xhr_streaming/websocket):
# forzare sempre "upgrade" rompe/bufferizza i trasporti non-websocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Cache-Control per URI (valutato a fine richiesta, quindi dopo il fallback SPA $uri vale /index.html).
# Stringa vuota = header non aggiunto (API/WS: decide il backend).
#  - /assets/*: file buildati da Vite con hash nel nome → immutabili per 1 anno.
#  - index.html, sw.js, manifest: sempre rivalidati, altrimenti gli aggiornamenti non arrivano
#    ai client (anche PWA installate).
#  - altri file di public/ (favicon, icone) senza hash → cache breve.
map $uri $cache_control {
    default                         "";
    ~^/api/                         "";
    ~^/ws/                          "";
    ~^/assets/                      "public, max-age=31536000, immutable";
    /                               "no-cache";
    /index.html                     "no-cache";
    /sw.js                          "no-cache";
    /manifest.webmanifest           "no-cache";
    ~*\.(png|jpe?g|gif|webp|avif|ico|svg|woff2?|ttf|otf|txt|xml|json)$  "public, max-age=86400";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Header a livello server: ereditati da tutte le location che NON definiscono add_header propri
    # (per questo nessuna location sotto usa add_header).
    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip: on-the-fly per ciò che non ha un .gz precompresso; gzip_static serve i .gz
    # generati in fase di build (Dockerfile, gzip -9).
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/manifest+json
        application/wasm
        image/svg+xml
        image/x-icon
        font/ttf
        font/otf
        application/vnd.ms-fontobject;

    # API proxy → backend. proxy_buffering off: lo streaming SSE dell'agente AI (text/event-stream)
    # deve arrivare token per token, non bufferizzato.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # WebSocket proxy → backend (STOMP su SockJS). Connection condizionale + buffering off: i frame
    # devono essere consegnati in tempo reale, non trattenuti finché non arriva un'altra richiesta.
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Manifest PWA con il MIME corretto (Cache-Control: no-cache via map).
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
    }

    # Asset hashed di Vite: se il file non esiste (es. chunk di una build precedente) → 404 vero,
    # MAI il fallback a index.html (sarebbe HTML servito come JS e messo in cache "immutable").
    location /assets/ {
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
